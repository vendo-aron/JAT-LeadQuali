AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  JAT-LeadQuali: API Gateway + ingest Lambda -> SQS -> qualification worker.
  The queue is what lets a form post return in under 200 ms while a Claude call that
  takes several seconds happens elsewhere, and it is where "a lead is never silently
  dropped" stops being a principle and becomes infrastructure.

Parameters:
  Stage:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment stage. Also the API Gateway stage name.
  WorkerTimeoutSeconds:
    Type: Number
    Default: 120
    MinValue: 30
    MaxValue: 600
    Description: >
      Worker Lambda timeout. Must comfortably exceed one Claude call with adaptive
      thinking at max_tokens 8000, plus enrichment, plus the database writes. The
      Anthropic client is built with its own 120 s timeout, so this is that plus headroom
      rather than an independent guess.
  WorkerReservedConcurrency:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 50
    Description: >
      Hard cap on concurrent workers. This is the Postgres decision's bill (plan section
      4): each container holds one connection, so this number is the worst-case
      connection count against RDS Proxy. Raising it without raising the database's
      connection budget is how a burst of leads takes the database down. Owned with #27.

      MaxValue is the half of #27's connection arithmetic that CloudFormation can enforce
      by itself. The whole relationship is:

        (WorkerReservedConcurrency + IngestReservedConcurrency) x connections-per-container
          <= floor(max_connections x ProxyMaxConnectionsPercent / 100)
        (50                       + 30)                         x 1
          <= floor(112            x 75                          / 100) = 84

      connections-per-container is 1 because store_postgres.engine_for builds its engine
      with pool_size=1 and max_overflow=0; max_connections is 112 because
      infra/network.yaml pins it there for a db.t4g.micro rather than leaving it to the
      instance-memory formula. CloudFormation has no way to constrain two parameters
      against each other, so the ceiling is split into two MaxValues that sum below the
      budget, and tests/unit/test_infra_network.py asserts the sum. Raise either one only
      together with DbInstanceClass in the network stack.
  IngestReservedConcurrency:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 30
    Description: >
      Hard cap on concurrent ingest containers, for the same reason the worker has one:
      api/main.py builds a PostgresLeadStore for the idempotency check and api/feedback.py
      a PostgresFeedbackStore for the one-click links, so every warm ingest container also
      holds a database connection. Without this the API side of the connection budget is
      unbounded, and the cap on the worker only bounds half the problem. The default of 20
      is sized to the API's own throttle above (50 rps steady, 100 burst) at roughly
      200 ms per request; MaxValue is set by the arithmetic on WorkerReservedConcurrency.
  IngestCredentialsSecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for the per-tenant ingest credentials JSON. An ARN, never the
      value: a secret passed as a template parameter shows up in the stack's Parameters
      tab, in drift detection, and in any CI log that echoes the deploy command.
  AnthropicApiKeySecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for the Anthropic API key. The one secret this system does not
      create: the value comes from the Anthropic console, so a human makes it per #43's
      runbook and passes the ARN here. Encrypt it with the network stack's
      SecretsKmsKeyArn, or these functions cannot decrypt it.
  DatabaseSecretArn:
    Type: String
    Description: >
      Secrets Manager ARN of the RDS-managed master user secret - the network stack's
      DatabaseMasterUserSecretArn output - holding a username and a password.

      Not a database *URL*. RDS generates and rotates this password itself, so a second
      secret containing a full URL with the password embedded would be a copy of the
      thing being rotated, and would go stale the first time it was. leadquali.config
      assembles the SQLAlchemy URL from this secret plus DatabaseHost, DatabasePort and
      DatabaseName, and appends sslmode=require because rds.force_ssl and the proxy's
      RequireTLS both refuse a plaintext session.
  FeedbackTokenSecretArn:
    Type: String
    Description: >
      Secrets Manager ARN for the feedback-link signing secret, generated by the network
      stack. Distinct from any ingest signing secret: one key, one purpose, and
      config.Settings raises at cold start if the two values are ever the same (#60).
  SecretsCacheTtlSeconds:
    Type: Number
    Default: 300
    MinValue: 0
    MaxValue: 3600
    Description: >
      How long a resolved secret is reused inside a warm container before it is fetched
      again. This is the only thing standing between "rotate a secret in the console" and
      "the fleet uses it", so it is also the delay on a revocation.

      Five minutes is the default because both ends of the trade are cheap at this size.
      Longer costs nothing but rotation latency; shorter costs an API call on every cold
      start, and Secrets Manager is rate-limited per account. The worst case is bounded by
      the reserved concurrency above: at most (30 ingest + 50 worker) warm containers
      holding four secrets each, refreshed every 300 s, is roughly one call per second.
      Zero disables the cache and is a debugging setting, not a deployment one.
  DatabaseHost:
    Type: String
    Description: >
      The network stack's DatabaseEndpoint output: the RDS Proxy endpoint when the proxy
      is enabled, the instance endpoint when it is not. Not a secret - it resolves only
      inside the VPC - which is why it is a plain parameter and the password is not.
  DatabasePort:
    Type: Number
    Default: 5432
    MinValue: 1
    MaxValue: 65535
    Description: The network stack's DatabasePort output.
  DatabaseName:
    Type: String
    Default: leadquali
    Description: The network stack's DatabaseName output.
  SesSender:
    Type: String
    Description: Verified SES sender address (docs/runbooks/ses-setup.md).
  SesConfigurationSet:
    Type: String
    Default: ""
    Description: SES configuration set for bounce and complaint tracking. Optional.
  EscalationDestination:
    Type: String
    Description: >
      Last-resort address for an escalated lead whose tenant has no destination for the
      tier it landed in. Required, because an escalation with nowhere to go is a dropped
      lead by another name (#14).
  FeedbackTokenTtlDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: How long a one-click feedback link stays valid.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Private subnets for the worker (#27). Empty deploys it outside a VPC, which works
      only against a publicly reachable database - fine for dev, never for prod.
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Security groups for the worker and ingest functions (#27). In the network stack this
      is LambdaSecurityGroupId, which reaches RDS Proxy on 5432 and cannot reach Postgres
      directly - the proxy's connection cap is only a cap if it cannot be walked around.
  MigrationSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Security groups for the migration function (#27's MigrationSecurityGroupId). It is
      separate because migrations are the one workload allowed to bypass RDS Proxy: alembic
      holds a single long transaction with DDL and advisory locks, which pins a backend
      connection and defeats the multiplexing the proxy exists for. Left empty, the
      migration function falls back to VpcSecurityGroupIds and goes through the proxy,
      which works and is merely worse.

Conditions:
  InVpc: !Not [!Equals [!Join ["", !Ref VpcSubnetIds], ""]]
  MigrationHasDedicatedSg:
    !Not [!Equals [!Join ["", !Ref MigrationSecurityGroupIds], ""]]

Globals:
  Function:
    Runtime: python3.13
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        ENV: !Ref Stage
        LOG_LEVEL: INFO

Resources:
  LeadDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "leadquali-${Stage}-leads-dlq"
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  LeadQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "leadquali-${Stage}-leads"
      VisibilityTimeout: 720
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt LeadDeadLetterQueue.Arn
        maxReceiveCount: 3

  # Decrypting a secret is a second permission, and it is the one that is easy to miss:
  # SAM's AWSSecretsManagerGetSecretValuePolicy grants secretsmanager:GetSecretValue and
  # nothing else, so with a customer-managed KMS key every GetSecretValue would fail with
  # AccessDenied until kms:Decrypt is granted too.
  #
  # Resource is "*" and the ViaService condition is what makes that safe. Two reasons it
  # is not written as a key ARN: the RDS-managed master user secret is encrypted with the
  # account's aws/secretsmanager key, whose ARN no template can name (#27's proxy role
  # policy has the same comment), and the Anthropic secret is created by hand. The
  # condition binds the grant to calls made *through Secrets Manager*, and a role that can
  # decrypt through Secrets Manager but can only call GetSecretValue on three named ARNs
  # can still read exactly three secrets. One managed policy rather than three inline
  # copies so that "what may these functions decrypt" has one answer.
  DecryptSecretsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: !Sub "leadquali-${Stage}: decrypt secrets, only via Secrets Manager"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: kms:Decrypt
            Resource: "*"
            Condition:
              StringEquals:
                kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "leadquali-${Stage}-ingest"
      CodeUri: ../
      Handler: leadquali.api.handlers.ingest_handler
      MemorySize: 512
      Timeout: 10
      ReservedConcurrentExecutions: !Ref IngestReservedConcurrency
      # Ingest is in the VPC for the same reason the worker is, and it is easy to miss:
      # this function talks to Postgres. api/main.py builds a PostgresLeadStore so that a
      # duplicate submission_id is rejected at the door, and api/feedback.py builds a
      # PostgresFeedbackStore for the one-click links in #19's emails. With the database
      # not publicly accessible - which is the whole point of #27 - a function outside the
      # VPC cannot reach it at all, so leaving ingest outside would not be a performance
      # choice, it would be a stack that returns 500 on the first lead.
      #
      # The cost is a cold start behind a synchronous HTTP request. Since Lambda moved to
      # shared Hyperplane ENIs this is tens of milliseconds rather than the ten seconds it
      # used to be, and the p99 target in plan section 8 has room for it - but it is the
      # one latency number in this stack that only a real deploy can settle, so measure it
      # before promising anything about it.
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          LEAD_QUEUE_URL: !Ref LeadQueue
          INGEST_CREDENTIALS_SECRET_ARN: !Ref IngestCredentialsSecretArn
          # This function serves /feedback/{token} as well as /leads, so it verifies the
          # signatures the worker mints and needs the same key. It does not get the
          # Anthropic key: it never calls the model.
          FEEDBACK_TOKEN_SECRET_ARN: !Ref FeedbackTokenSecretArn
          FEEDBACK_TOKEN_TTL_DAYS: !Ref FeedbackTokenTtlDays
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PORT: !Ref DatabasePort
          DATABASE_NAME: !Ref DatabaseName
          SECRETS_CACHE_TTL_SECONDS: !Ref SecretsCacheTtlSeconds
      Policies:
        - SQSSendMessagePolicy:
            QueueName: !GetAtt LeadQueue.QueueName
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref IngestCredentialsSecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref FeedbackTokenSecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn
        - !Ref DecryptSecretsPolicy
        - VPCAccessPolicy: {}
      Events:
        Ingest:
          Type: Api
          Properties:
            RestApiId: !Ref LeadApi
            Path: /leads
            Method: post
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref LeadApi
            Path: /health
            Method: get
        Feedback:
          Type: Api
          Properties:
            RestApiId: !Ref LeadApi
            Path: /feedback/{token}
            Method: any

  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "leadquali-${Stage}-worker"
      CodeUri: ../
      Handler: leadquali.api.worker.lambda_handler
      MemorySize: 1024
      Timeout: !Ref WorkerTimeoutSeconds
      ReservedConcurrentExecutions: !Ref WorkerReservedConcurrency
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          ANTHROPIC_API_KEY_SECRET_ARN: !Ref AnthropicApiKeySecretArn
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PORT: !Ref DatabasePort
          DATABASE_NAME: !Ref DatabaseName
          FEEDBACK_TOKEN_SECRET_ARN: !Ref FeedbackTokenSecretArn
          SECRETS_CACHE_TTL_SECONDS: !Ref SecretsCacheTtlSeconds
          SES_SENDER: !Ref SesSender
          SES_CONFIGURATION_SET: !Ref SesConfigurationSet
          ESCALATION_DESTINATION: !Ref EscalationDestination
          FEEDBACK_TOKEN_TTL_DAYS: !Ref FeedbackTokenTtlDays
          FEEDBACK_BASE_URL: !Sub "https://${LeadApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
      Policies:
        # Three named ARNs and no wildcard: this function cannot read the ingest
        # credential map, which is the half of the system it has no business in.
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref AnthropicApiKeySecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref FeedbackTokenSecretArn
        - !Ref DecryptSecretsPolicy
        - SESCrudPolicy:
            IdentityName: !Ref SesSender
        - VPCAccessPolicy: {}
      Events:
        Leads:
          Type: SQS
          Properties:
            Queue: !GetAtt LeadQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes: [ReportBatchItemFailures]

  MigrationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "leadquali-${Stage}-migrate"
      CodeUri: ../
      Handler: leadquali.api.migrate.lambda_handler
      MemorySize: 512
      Timeout: 300
      # Exactly one. Not a parameter, because there is no value other than one that is
      # correct: two concurrent alembic runs contend for the same DDL and advisory locks,
      # and the loser spends the Lambda's whole 300 s waiting to do nothing. It is also
      # the single direct connection reserved for migrations in #27's budget.
      ReservedConcurrentExecutions: 1
      VpcConfig: !If
        - InVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !If
            - MigrationHasDedicatedSg
            - !Ref MigrationSecurityGroupIds
            - !Ref VpcSecurityGroupIds
        - !Ref AWS::NoValue
      Environment:
        Variables:
          DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
          DATABASE_HOST: !Ref DatabaseHost
          DATABASE_PORT: !Ref DatabasePort
          DATABASE_NAME: !Ref DatabaseName
          SECRETS_CACHE_TTL_SECONDS: !Ref SecretsCacheTtlSeconds
      Policies:
        # One secret. A migration needs the database and nothing else.
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn
        - !Ref DecryptSecretsPolicy
        - VPCAccessPolicy: {}

  LeadApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 100
          ThrottlingRateLimit: 50
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency_ms":"$context.responseLatency"}

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/leadquali-${Stage}"
      RetentionInDays: 30

Outputs:
  IngestUrl:
    Description: The endpoint the website form posts to (#30's cutover runbook).
    Value: !Sub "https://${LeadApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/leads"
  QueueUrl:
    Value: !Ref LeadQueue
  DeadLetterQueueArn:
    Description: Watched by #29's DLQ-depth alarm.
    Value: !GetAtt LeadDeadLetterQueue.Arn
  WorkerFunctionName:
    Value: !Ref WorkerFunction
  MigrationFunctionName:
    Description: Invoke once per deploy, before traffic, to run alembic upgrade head.
    Value: !Ref MigrationFunction
