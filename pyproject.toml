[project]
name = "leadquali"
version = "0.1.0"
description = "AI lead qualification agent: qualify inbound web-form leads and route them."
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    # Password hashing for tenant API keys (#31). A runtime dependency of the ingest
    # Lambda, not a dev tool: adapters/keyhash_argon2.py verifies every presented key.
    "argon2-cffi",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic>=1.16",
    "boto3",
    "mangum",
    # The staff admin UI (#36) is server-rendered HTML in the same Lambda as everything
    # else: Jinja2 renders the templates, python-multipart lets FastAPI parse the form
    # posts they submit. Both are runtime dependencies of the API, not dev tools.
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
    # SES and Secrets Manager are mocked in-process: there are no AWS credentials in CI
    # and a test that needed them would simply never run. The extras are named rather
    # than moto[all] because the transitive dependency set of "all" is enormous.
    "moto[secretsmanager,ses]",
    # The CI and eval workflows are configuration, and configuration that spends money
    # gets asserted rather than assumed: tests/unit/test_eval_workflow.py parses them.
    "pyyaml",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# A template that is not packaged is a 500 in Lambda and a pass in the tests, which is
# the worst combination available. tests/unit/test_admin_templates.py asserts that every
# file under api/templates matches one of these globs.
leadquali = ["prompts/*.md", "py.typed", "api/templates/*.html", "api/templates/admin/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (database, network)",
    "live_api: makes billable Anthropic API calls; never runs in the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Markdown is documentation, not source: never reformatted by the Python formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
# `scripts` is in here so the seed entry point is type-checked like the rest of the code.
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
