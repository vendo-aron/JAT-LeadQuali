[project]
name = "leadquali"
version = "0.1.0"
description = "AI lead qualification agent: qualify inbound web-form leads and route them."
requires-python = ">=3.13"
dependencies = [
    "anthropic",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "psycopg[binary]",
    "alembic>=1.16",
    "boto3",
    "mangum",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "httpx",
    # SES is mocked in-process: there are no AWS credentials in CI and a test that
    # needed them would simply never run.
    "moto[ses]",
    # The CI and eval workflows are configuration, and configuration that spends money
    # gets asserted rather than assumed: tests/unit/test_eval_workflow.py parses them.
    "pyyaml",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leadquali = ["prompts/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires external services (database, network)",
    "live_api: makes billable Anthropic API calls; never runs in the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Markdown is documentation, not source: never reformatted by the Python formatter.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
# `scripts` is in here so the seed entry point is type-checked like the rest of the code.
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = true
