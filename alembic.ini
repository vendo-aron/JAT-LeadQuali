# Alembic configuration. The database URL is NOT here on purpose: migrations/env.py reads
# it from leadquali.config.Settings (i.e. DATABASE_URL in the environment), so there is one
# way to point the app at a database and no chance of a committed connection string.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
# Timestamped, ordered filenames: `ls versions/` reads as a history.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
